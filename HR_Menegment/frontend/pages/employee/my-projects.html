<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - My Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action active">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <h1 class="h4 mb-4">My Projects</h1>

                <div class="row g-3" id="projectsContainer">
                    <div class="col-12 text-center">Loading...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Project Details Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="projectModalTitle">Project Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="projectModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadProjects() {
            try {
                const res = await API.getProjects();
                const container = document.getElementById('projectsContainer');
                if (res.success && res.data.length > 0) {
                    container.innerHTML = res.data.map(project => `
                        <div class="col-md-6 col-lg-4">
                            <div class="card shadow-sm h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${project.Project_name}</h5>
                                    <p class="card-text text-muted small">${project.Category_name || 'No Category'}</p>
                                    <p class="card-text">${project.Description || 'No description'}</p>
                                    <div class="mb-2">
                                        <small class="text-muted">Start: ${project.Start_date || '-'}</small><br>
                                        <small class="text-muted">End: ${project.End_date || '-'}</small>
                                    </div>
                                    <span class="badge bg-${project.Status === 'Active' ? 'success' : 'secondary'}">${project.Status}</span>
                                    <div class="mt-2">
                                        <button class="btn btn-sm btn-outline-primary" onclick="viewProject(${project.Project_id})">View Details</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="col-12 text-center">No projects assigned</div>';
                }
            } catch (e) {
                document.getElementById('projectsContainer').innerHTML = '<div class="col-12 text-center text-danger">Error loading projects</div>';
            }
        }

        async function viewProject(id) {
            try {
                const res = await API.getProjects();
                const project = res.data.find(p => p.Project_id === id);
                if (project) {
                    document.getElementById('projectModalTitle').textContent = project.Project_name;
                    document.getElementById('projectModalBody').innerHTML = `
                        <p><strong>Category:</strong> ${project.Category_name || 'N/A'}</p>
                        <p><strong>Description:</strong> ${project.Description || 'N/A'}</p>
                        <p><strong>Start Date:</strong> ${project.Start_date || 'N/A'}</p>
                        <p><strong>End Date:</strong> ${project.End_date || 'N/A'}</p>
                        <p><strong>Status:</strong> <span class="badge bg-${project.Status === 'Active' ? 'success' : 'secondary'}">${project.Status}</span></p>
                        ${project.employees && project.employees.length > 0 ? `
                            <p><strong>Team Members:</strong></p>
                            <ul>
                                ${project.employees.map(emp => `<li>${emp.Emp_firstName} ${emp.Emp_lastName}</li>`).join('')}
                            </ul>
                        ` : ''}
                    `;
                    new bootstrap.Modal(document.getElementById('projectModal')).show();
                }
            } catch (e) {
                alert('Failed to load project details');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
