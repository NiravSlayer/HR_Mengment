<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - My Leaves</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action active">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">My Leaves</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#leaveModal">Request Leave</button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Leave Type</th>
                                        <th>Start Date</th>
                                        <th>End Date</th>
                                        <th>Days</th>
                                        <th>Status</th>
                                        <th>Comment</th>
                                    </tr>
                                </thead>
                                <tbody id="leavesTableBody">
                                    <tr><td colspan="6" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Leave Request Modal -->
    <div class="modal fade" id="leaveModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Request Leave</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="leaveForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Leave Type</label>
                            <select class="form-select" id="leaveType" required>
                                <option value="">Select Type</option>
                                <option value="Sick">Sick Leave</option>
                                <option value="Casual">Casual Leave</option>
                                <option value="Personal">Personal Leave</option>
                                <option value="Vacation">Vacation</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="leaveStartDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">End Date</label>
                                <input type="date" class="form-control" id="leaveEndDate" required>
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label class="form-label">Attachment (Optional)</label>
                            <input type="file" class="form-control" id="leaveAttachment">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadLeaves() {
            try {
                const res = await API.getMyLeaves();
                const tbody = document.getElementById('leavesTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(leave => `
                        <tr>
                            <td>${leave.Leave_type}</td>
                            <td>${leave.Start_date}</td>
                            <td>${leave.End_date}</td>
                            <td>${leave.Days}</td>
                            <td><span class="badge bg-${leave.Status === 'Approved' ? 'success' : leave.Status === 'Rejected' ? 'danger' : 'warning'}">${leave.Status}</span></td>
                            <td>${leave.Comment || '-'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No leave requests</td></tr>';
                }
            } catch (e) {
                document.getElementById('leavesTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading leaves</td></tr>';
            }
        }

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                type: document.getElementById('leaveType').value,
                startDate: document.getElementById('leaveStartDate').value,
                endDate: document.getElementById('leaveEndDate').value
            };
            try {
                await API.requestLeave(data);
                alert('Leave request submitted successfully');
                bootstrap.Modal.getInstance(document.getElementById('leaveModal')).hide();
                document.getElementById('leaveForm').reset();
                loadLeaves();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadLeaves);
    </script>
</body>
</html>
