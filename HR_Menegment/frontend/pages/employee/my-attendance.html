<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - My Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action active">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <h1 class="h4 mb-4">My Attendance</h1>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <form class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Filter by Date</label>
                                <input type="date" class="form-control" id="filterDate" onchange="loadAttendance()">
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" class="btn btn-secondary w-100" onclick="loadAttendance()">Filter</button>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-secondary w-100" onclick="document.getElementById('filterDate').value=''; loadAttendance();">Clear</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Check-in</th>
                                        <th>Check-out</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <tr><td colspan="4" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadAttendance() {
            try {
                const res = await API.getMyAttendance();
                const tbody = document.getElementById('attendanceTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(att => `
                        <tr>
                            <td>${att.Date}</td>
                            <td><span class="badge bg-${att.Status === 'Present' ? 'success' : att.Status === 'Absent' ? 'danger' : 'warning'}">${att.Status}</span></td>
                            <td>${att.Checkin_time || '-'}</td>
                            <td>${att.Checkout_time || '-'}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No attendance records found</td></tr>';
                }
            } catch (e) {
                document.getElementById('attendanceTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading attendance</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAttendance);
    </script>
</body>
</html>
