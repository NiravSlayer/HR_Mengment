<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - My Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action active">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <h1 class="h4 mb-4">My Tasks</h1>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Description</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>Due Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tasksTableBody">
                                    <tr><td colspan="6" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Update Status Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Task Status</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="statusForm">
                    <div class="modal-body">
                        <input type="hidden" id="statusTaskId">
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="statusValue" required>
                                <option value="Pending">Pending</option>
                                <option value="Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadTasks() {
            try {
                const res = await API.getMyTasks();
                const tbody = document.getElementById('tasksTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(task => `
                        <tr>
                            <td>${task.Title}</td>
                            <td>${task.Description || '-'}</td>
                            <td><span class="badge bg-${task.Priority === 'High' ? 'danger' : task.Priority === 'Medium' ? 'warning' : 'info'}">${task.Priority}</span></td>
                            <td><span class="badge bg-${task.Status === 'Done' ? 'success' : task.Status === 'Progress' ? 'primary' : 'secondary'}">${task.Status}</span></td>
                            <td>${task.Due_date || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="updateStatus(${task.Task_id}, '${task.Status}')">Update Status</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No tasks assigned</td></tr>';
                }
            } catch (e) {
                document.getElementById('tasksTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading tasks</td></tr>';
            }
        }

        function updateStatus(id, currentStatus) {
            document.getElementById('statusTaskId').value = id;
            document.getElementById('statusValue').value = currentStatus;
            new bootstrap.Modal(document.getElementById('statusModal')).show();
        }

        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('statusTaskId').value);
            const status = document.getElementById('statusValue').value;
            try {
                await API.updateTask(id, { status });
                alert('Task status updated successfully');
                bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
                loadTasks();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
