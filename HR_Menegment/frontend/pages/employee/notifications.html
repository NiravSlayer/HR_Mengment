<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action active">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Notifications</h1>
                    <button class="btn btn-secondary btn-sm" onclick="markAllAsRead()">Mark All as Read</button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div id="notificationsContainer">
                            <div class="text-center">Loading...</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadNotifications() {
            try {
                const res = await API.getNotifications();
                const container = document.getElementById('notificationsContainer');
                if (res.success && res.data.length > 0) {
                    container.innerHTML = res.data.map(notif => `
                        <div class="card mb-2 ${notif.Status === 'Unread' ? 'border-primary' : ''}">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6 class="mb-1">${notif.Title}</h6>
                                        <p class="mb-1">${notif.Message}</p>
                                        <small class="text-muted">${new Date(notif.Created_at).toLocaleString()}</small>
                                    </div>
                                    <div>
                                        ${notif.Status === 'Unread' ? '<span class="badge bg-primary">Unread</span>' : ''}
                                        ${notif.Status === 'Unread' ? `<button class="btn btn-sm btn-outline-primary mt-2" onclick="markAsRead(${notif.Notification_id})">Mark as Read</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center text-muted">No notifications</div>';
                }
            } catch (e) {
                document.getElementById('notificationsContainer').innerHTML = '<div class="text-center text-danger">Error loading notifications</div>';
            }
        }

        async function markAsRead(id) {
            try {
                await API.markNotificationAsRead(id);
                loadNotifications();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        async function markAllAsRead() {
            try {
                await API.markAllNotificationsAsRead();
                alert('All notifications marked as read');
                loadNotifications();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadNotifications);
    </script>
</body>
</html>
