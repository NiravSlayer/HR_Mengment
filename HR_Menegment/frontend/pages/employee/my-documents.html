<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - My Documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Employee</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="my-profile.html" class="list-group-item list-group-item-action">My Profile</a>
                    <a href="my-attendance.html" class="list-group-item list-group-item-action">My Attendance</a>
                    <a href="my-leaves.html" class="list-group-item list-group-item-action">My Leaves</a>
                    <a href="my-tasks.html" class="list-group-item list-group-item-action">My Tasks</a>
                    <a href="my-projects.html" class="list-group-item list-group-item-action">My Projects</a>
                    <a href="my-documents.html" class="list-group-item list-group-item-action active">My Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <h1 class="h4 mb-4">My Documents</h1>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>File Name</th>
                                        <th>Type</th>
                                        <th>Uploaded</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="documentsTableBody">
                                    <tr><td colspan="4" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-employee.js"></script>
    <script>
        async function loadDocuments() {
            try {
                const res = await API.getDocuments();
                const tbody = document.getElementById('documentsTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(doc => `
                        <tr>
                            <td>${doc.File_name}</td>
                            <td><span class="badge bg-info">${doc.File_type}</span></td>
                            <td>${new Date(doc.Uploaded_at).toLocaleDateString()}</td>
                            <td>
                                <a href="../../${doc.File_path}" target="_blank" class="btn btn-sm btn-outline-primary">Download</a>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No documents found</td></tr>';
                }
            } catch (e) {
                document.getElementById('documentsTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading documents</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadDocuments);
    </script>
</body>
</html>
