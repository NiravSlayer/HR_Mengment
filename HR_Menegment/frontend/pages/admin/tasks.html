<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Admin</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="employees.html" class="list-group-item list-group-item-action">Employees</a>
                    <a href="attendance.html" class="list-group-item list-group-item-action">Attendance</a>
                    <a href="leaves.html" class="list-group-item list-group-item-action">Leaves</a>
                    <a href="tasks.html" class="list-group-item list-group-item-action active">Tasks</a>
                    <a href="projects.html" class="list-group-item list-group-item-action">Projects</a>
                    <a href="project-categories.html" class="list-group-item list-group-item-action">Project Categories</a>
                    <a href="documents.html" class="list-group-item list-group-item-action">Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                    <a href="settings.html" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Task Management</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">Create Task</button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Assigned To</th>
                                        <th>Priority</th>
                                        <th>Status</th>
                                        <th>Due Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tasksTableBody">
                                    <tr><td colspan="6" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">Create Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="taskForm">
                    <div class="modal-body">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="taskDescription" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Assign To</label>
                                <select class="form-select" id="taskAssignedTo" required>
                                    <option value="">Select Employee</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Priority</label>
                                <select class="form-select" id="taskPriority">
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="taskStatus">
                                    <option value="Pending">Pending</option>
                                    <option value="Progress">In Progress</option>
                                    <option value="Done">Done</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Due Date</label>
                            <input type="date" class="form-control" id="taskDueDate">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-admin.js"></script>
    <script>
        let employees = [];
        let currentTaskId = null;

        async function loadEmployees() {
            try {
                const res = await API.getEmployees();
                employees = res.data || [];
                const select = document.getElementById('taskAssignedTo');
                select.innerHTML = '<option value="">Select Employee</option>';
                employees.forEach(emp => {
                    select.innerHTML += `<option value="${emp.Emp_id}">${emp.Emp_firstName} ${emp.Emp_lastName}</option>`;
                });
            } catch (e) {
                alert('Failed to load employees');
            }
        }

        async function loadTasks() {
            try {
                const res = await API.getTasks();
                const tbody = document.getElementById('tasksTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(task => `
                        <tr>
                            <td>${task.Title}</td>
                            <td>${task.Emp_firstName || ''} ${task.Emp_lastName || ''}</td>
                            <td><span class="badge bg-${task.Priority === 'High' ? 'danger' : task.Priority === 'Medium' ? 'warning' : 'info'}">${task.Priority}</span></td>
                            <td><span class="badge bg-${task.Status === 'Done' ? 'success' : task.Status === 'Progress' ? 'primary' : 'secondary'}">${task.Status}</span></td>
                            <td>${task.Due_date || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="editTask(${task.Task_id}, '${task.Title}', '${task.Description || ''}', ${task.Assigned_to}, '${task.Priority}', '${task.Status}', '${task.Due_date || ''}')">Edit</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No tasks found</td></tr>';
                }
            } catch (e) {
                document.getElementById('tasksTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading tasks</td></tr>';
            }
        }

        function editTask(id, title, desc, assignedTo, priority, status, dueDate) {
            currentTaskId = id;
            document.getElementById('taskId').value = id;
            document.getElementById('taskTitle').value = title;
            document.getElementById('taskDescription').value = desc;
            document.getElementById('taskAssignedTo').value = assignedTo;
            document.getElementById('taskPriority').value = priority;
            document.getElementById('taskStatus').value = status;
            document.getElementById('taskDueDate').value = dueDate;
            document.getElementById('taskModalTitle').textContent = 'Edit Task';
            new bootstrap.Modal(document.getElementById('taskModal')).show();
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                assignedTo: parseInt(document.getElementById('taskAssignedTo').value),
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                dueDate: document.getElementById('taskDueDate').value || null
            };
            try {
                if (currentTaskId) {
                    await API.updateTask(currentTaskId, data);
                    alert('Task updated successfully');
                } else {
                    await API.createTask(data);
                    alert('Task created successfully');
                }
                bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
                document.getElementById('taskForm').reset();
                currentTaskId = null;
                document.getElementById('taskModalTitle').textContent = 'Create Task';
                loadTasks();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.getElementById('taskModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('taskForm').reset();
            currentTaskId = null;
            document.getElementById('taskModalTitle').textContent = 'Create Task';
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
            loadTasks();
        });
    </script>
</body>
</html>
