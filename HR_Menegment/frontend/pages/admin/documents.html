<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Document Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Admin</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="employees.html" class="list-group-item list-group-item-action">Employees</a>
                    <a href="attendance.html" class="list-group-item list-group-item-action">Attendance</a>
                    <a href="leaves.html" class="list-group-item list-group-item-action">Leaves</a>
                    <a href="tasks.html" class="list-group-item list-group-item-action">Tasks</a>
                    <a href="projects.html" class="list-group-item list-group-item-action">Projects</a>
                    <a href="project-categories.html" class="list-group-item list-group-item-action">Project Categories</a>
                    <a href="documents.html" class="list-group-item list-group-item-action active">Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                    <a href="settings.html" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Document Management</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadModal">Upload Document</button>
                </div>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <label class="form-label">Filter by Employee</label>
                        <select class="form-select" id="filterEmployee" onchange="loadDocuments()">
                            <option value="">All Employees</option>
                        </select>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>File Name</th>
                                        <th>Employee</th>
                                        <th>Type</th>
                                        <th>Uploaded</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="documentsTableBody">
                                    <tr><td colspan="5" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload Document</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Employee</label>
                            <select class="form-select" id="uploadEmpId" required>
                                <option value="">Select Employee</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">File</label>
                            <input type="file" class="form-control" id="uploadFile" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-admin.js"></script>
    <script>
        let employees = [];

        async function loadEmployees() {
            try {
                const res = await API.getEmployees();
                employees = res.data || [];
                const uploadSelect = document.getElementById('uploadEmpId');
                const filterSelect = document.getElementById('filterEmployee');
                uploadSelect.innerHTML = '<option value="">Select Employee</option>';
                filterSelect.innerHTML = '<option value="">All Employees</option>';
                employees.forEach(emp => {
                    const option = `<option value="${emp.Emp_id}">${emp.Emp_firstName} ${emp.Emp_lastName}</option>`;
                    uploadSelect.innerHTML += option;
                    filterSelect.innerHTML += option;
                });
            } catch (e) {
                alert('Failed to load employees');
            }
        }

        async function loadDocuments() {
            const empId = document.getElementById('filterEmployee').value;
            try {
                let url = '../backend/index.php?action=documents';
                if (empId) url += `&empId=${empId}`;
                const res = await fetch(url);
                const data = await res.json();
                
                const tbody = document.getElementById('documentsTableBody');
                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(doc => `
                        <tr>
                            <td>${doc.File_name}</td>
                            <td>${doc.Emp_firstName || ''} ${doc.Emp_lastName || ''}</td>
                            <td><span class="badge bg-info">${doc.File_type}</span></td>
                            <td>${new Date(doc.Uploaded_at).toLocaleDateString()}</td>
                            <td>
                                <a href="../../${doc.File_path}" target="_blank" class="btn btn-sm btn-outline-primary">Download</a>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteDocument(${doc.Doc_id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center">No documents found</td></tr>';
                }
            } catch (e) {
                document.getElementById('documentsTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error loading documents</td></tr>';
            }
        }

        async function deleteDocument(id) {
            if (!confirm('Are you sure you want to delete this document?')) return;
            try {
                await API.deleteDocument(id);
                alert('Document deleted successfully');
                loadDocuments();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('uploadFile').files[0];
            const empId = parseInt(document.getElementById('uploadEmpId').value);
            if (!file) {
                alert('Please select a file');
                return;
            }
            try {
                await API.uploadDocument(file, empId);
                alert('Document uploaded successfully');
                bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
                document.getElementById('uploadForm').reset();
                loadDocuments();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
            loadDocuments();
        });
    </script>
</body>
</html>
