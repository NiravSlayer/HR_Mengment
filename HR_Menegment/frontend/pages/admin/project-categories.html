<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Project Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Admin</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="employees.html" class="list-group-item list-group-item-action">Employees</a>
                    <a href="attendance.html" class="list-group-item list-group-item-action">Attendance</a>
                    <a href="leaves.html" class="list-group-item list-group-item-action">Leaves</a>
                    <a href="tasks.html" class="list-group-item list-group-item-action">Tasks</a>
                    <a href="projects.html" class="list-group-item list-group-item-action">Projects</a>
                    <a href="project-categories.html" class="list-group-item list-group-item-action active">Project Categories</a>
                    <a href="documents.html" class="list-group-item list-group-item-action">Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                    <a href="settings.html" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Project Categories</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal">Add Category</button>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Category Name</th>
                                        <th>Description</th>
                                        <th>Created</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTableBody">
                                    <tr><td colspan="4" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="categoryForm">
                    <div class="modal-body">
                        <input type="hidden" id="categoryId">
                        <div class="mb-3">
                            <label class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="categoryDescription" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-admin.js"></script>
    <script>
        let currentCategoryId = null;

        async function loadCategories() {
            try {
                const res = await API.getProjectCategories();
                const tbody = document.getElementById('categoriesTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(cat => `
                        <tr>
                            <td>${cat.Category_name}</td>
                            <td>${cat.Description || '-'}</td>
                            <td>${new Date(cat.Created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="editCategory(${cat.ProjectCategory_id}, '${cat.Category_name}', '${(cat.Description || '').replace(/'/g, "\\'")}')">Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${cat.ProjectCategory_id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No categories found</td></tr>';
                }
            } catch (e) {
                document.getElementById('categoriesTableBody').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading categories</td></tr>';
            }
        }

        function editCategory(id, name, desc) {
            currentCategoryId = id;
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('categoryDescription').value = desc;
            document.getElementById('categoryModalTitle').textContent = 'Edit Category';
            new bootstrap.Modal(document.getElementById('categoryModal')).show();
        }

        async function deleteCategory(id) {
            if (!confirm('Are you sure you want to delete this category?')) return;
            try {
                await API.deleteProjectCategory(id);
                alert('Category deleted successfully');
                loadCategories();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('categoryName').value,
                description: document.getElementById('categoryDescription').value
            };
            try {
                if (currentCategoryId) {
                    await API.updateProjectCategory(currentCategoryId, data);
                    alert('Category updated successfully');
                } else {
                    await API.createProjectCategory(data);
                    alert('Category created successfully');
                }
                bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
                document.getElementById('categoryForm').reset();
                currentCategoryId = null;
                document.getElementById('categoryModalTitle').textContent = 'Add Category';
                loadCategories();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.getElementById('categoryModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('categoryForm').reset();
            currentCategoryId = null;
            document.getElementById('categoryModalTitle').textContent = 'Add Category';
        });

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
