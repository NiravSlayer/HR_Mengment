<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Admin</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="employees.html" class="list-group-item list-group-item-action active">Employees</a>
                    <a href="attendance.html" class="list-group-item list-group-item-action">Attendance</a>
                    <a href="leaves.html" class="list-group-item list-group-item-action">Leaves</a>
                    <a href="tasks.html" class="list-group-item list-group-item-action">Tasks</a>
                    <a href="projects.html" class="list-group-item list-group-item-action">Projects</a>
                    <a href="project-categories.html" class="list-group-item list-group-item-action">Project Categories</a>
                    <a href="documents.html" class="list-group-item list-group-item-action">Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                    <a href="settings.html" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h1 class="h4 mb-0">Employees</h1>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#employeeModal">Add Employee</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Project Category</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTableBody">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Employee Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="employeeModalTitle">Add Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="employeeForm">
                    <div class="modal-body">
                        <input type="hidden" id="employeeId">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Employee Code</label>
                                <input type="text" class="form-control" id="empCode" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Project Category</label>
                                <select class="form-select" id="empCategory">
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" id="empFirstName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="empLastName" required>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="empEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="empPhone">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-4">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="empDob">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Gender</label>
                                <select class="form-select" id="empGender">
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Joining Date</label>
                                <input type="date" class="form-control" id="empJoiningDate">
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <label class="form-label">Salary</label>
                                <input type="number" class="form-control" id="empSalary" step="0.01">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="empStatus">
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" id="empAddress" rows="2"></textarea>
                        </div>
                        <div class="mt-3" id="passwordField">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="empPassword" placeholder="Leave blank to keep current">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-admin.js"></script>
    <script>
        let employees = [];
        let categories = [];
        let currentEmployeeId = null;

        async function loadCategories() {
            try {
                const res = await API.getProjectCategories();
                categories = res.data || [];
                const select = document.getElementById('empCategory');
                select.innerHTML = '<option value="">Select Category</option>';
                categories.forEach(cat => {
                    select.innerHTML += `<option value="${cat.ProjectCategory_id}">${cat.Category_name}</option>`;
                });
            } catch (e) {
                console.error('Failed to load categories');
            }
        }

        async function loadEmployees() {
            try {
                const res = await API.getEmployees();
                employees = res.data || [];
                const tbody = document.getElementById('employeesTableBody');
                if (res.success && res.data.length > 0) {
                    tbody.innerHTML = res.data.map(emp => `
                        <tr>
                            <td>${emp.Emp_code}</td>
                            <td>${emp.Emp_firstName} ${emp.Emp_lastName}</td>
                            <td>${emp.Emp_email}</td>
                            <td>${emp.Category_name || '-'}</td>
                            <td><span class="badge bg-${emp.Status === 'Active' ? 'success' : 'danger'}">${emp.Status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="editEmployee(${emp.Emp_id})">Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(${emp.Emp_id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No employees found</td></tr>';
                }
            } catch (e) {
                document.getElementById('employeesTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error loading employees</td></tr>';
            }
        }

        async function editEmployee(id) {
            const emp = employees.find(e => e.Emp_id === id);
            if (!emp) return;
            currentEmployeeId = id;
            document.getElementById('employeeId').value = id;
            document.getElementById('empCode').value = emp.Emp_code;
            document.getElementById('empFirstName').value = emp.Emp_firstName;
            document.getElementById('empLastName').value = emp.Emp_lastName;
            document.getElementById('empEmail').value = emp.Emp_email;
            document.getElementById('empPhone').value = emp.Emp_phone || '';
            document.getElementById('empDob').value = emp.Emp_dob || '';
            document.getElementById('empGender').value = emp.Emp_gender || '';
            document.getElementById('empJoiningDate').value = emp.Joining_date || '';
            document.getElementById('empCategory').value = emp.ProjectCategory_id || '';
            document.getElementById('empSalary').value = emp.Salary || '';
            document.getElementById('empAddress').value = emp.Address || '';
            document.getElementById('empStatus').value = emp.Status || 'Active';
            document.getElementById('employeeModalTitle').textContent = 'Edit Employee';
            document.getElementById('passwordField').style.display = 'none';
            new bootstrap.Modal(document.getElementById('employeeModal')).show();
        }

        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) return;
            try {
                await API.deleteEmployee(id);
                alert('Employee deleted successfully');
                loadEmployees();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        }

        document.getElementById('employeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                code: document.getElementById('empCode').value,
                firstName: document.getElementById('empFirstName').value,
                lastName: document.getElementById('empLastName').value,
                email: document.getElementById('empEmail').value,
                phone: document.getElementById('empPhone').value || null,
                dob: document.getElementById('empDob').value || null,
                gender: document.getElementById('empGender').value || null,
                joiningDate: document.getElementById('empJoiningDate').value || null,
                categoryId: document.getElementById('empCategory').value || null,
                salary: document.getElementById('empSalary').value || null,
                address: document.getElementById('empAddress').value || null,
                status: document.getElementById('empStatus').value
            };
            if (!currentEmployeeId) {
                data.password = document.getElementById('empPassword').value || 'Employee@123';
            }
            try {
                if (currentEmployeeId) {
                    await API.updateEmployee(currentEmployeeId, data);
                    alert('Employee updated successfully');
                } else {
                    await API.createEmployee(data);
                    alert('Employee created successfully');
                }
                bootstrap.Modal.getInstance(document.getElementById('employeeModal')).hide();
                document.getElementById('employeeForm').reset();
                currentEmployeeId = null;
                document.getElementById('employeeModalTitle').textContent = 'Add Employee';
                document.getElementById('passwordField').style.display = 'block';
                loadEmployees();
            } catch (e) {
                alert('Failed: ' + e.message);
            }
        });

        document.getElementById('employeeModal').addEventListener('hidden.bs.modal', () => {
            document.getElementById('employeeForm').reset();
            currentEmployeeId = null;
            document.getElementById('employeeModalTitle').textContent = 'Add Employee';
            document.getElementById('passwordField').style.display = 'block';
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
            loadEmployees();
        });
    </script>
</body>
</html>
