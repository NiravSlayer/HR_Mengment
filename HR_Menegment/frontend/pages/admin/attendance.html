<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMS - Attendance Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">HRMS - Admin</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 bg-light border-end min-vh-100">
                <div class="list-group list-group-flush py-3">
                    <a href="dashboard.html" class="list-group-item list-group-item-action">Dashboard</a>
                    <a href="employees.html" class="list-group-item list-group-item-action">Employees</a>
                    <a href="attendance.html" class="list-group-item list-group-item-action active">Attendance</a>
                    <a href="leaves.html" class="list-group-item list-group-item-action">Leaves</a>
                    <a href="tasks.html" class="list-group-item list-group-item-action">Tasks</a>
                    <a href="projects.html" class="list-group-item list-group-item-action">Projects</a>
                    <a href="project-categories.html" class="list-group-item list-group-item-action">Project Categories</a>
                    <a href="documents.html" class="list-group-item list-group-item-action">Documents</a>
                    <a href="notifications.html" class="list-group-item list-group-item-action">Notifications</a>
                    <a href="settings.html" class="list-group-item list-group-item-action">Settings</a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="h4 mb-0">Attendance Management</h1>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#markAttendanceModal">Mark Attendance</button>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form class="row g-3" id="filterForm">
                            <div class="col-md-3">
                                <label class="form-label">Employee</label>
                                <select class="form-select" id="filterEmployee">
                                    <option value="">All Employees</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Project Category</label>
                                <select class="form-select" id="filterCategory">
                                    <option value="">All Categories</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" id="filterDate">
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button type="button" class="btn btn-secondary w-100" onclick="loadAttendance()">Filter</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Employee</th>
                                        <th>Category</th>
                                        <th>Status</th>
                                        <th>Check-in</th>
                                        <th>Check-out</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <tr><td colspan="7" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Mark Attendance Modal -->
    <div class="modal fade" id="markAttendanceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Mark Attendance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="markAttendanceForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Employee</label>
                            <select class="form-select" id="markEmpId" required>
                                <option value="">Select Employee</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="markDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="markStatus" required>
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                                <option value="Leave">Leave</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Check-in Time</label>
                                <input type="time" class="form-control" id="markCheckin">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Check-out Time</label>
                                <input type="time" class="form-control" id="markCheckout">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Mark Attendance</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/layout-admin.js"></script>
    <script>
        let employees = [];
        let categories = [];

        async function loadEmployees() {
            try {
                const res = await API.getEmployees();
                employees = res.data || [];
                const select = document.getElementById('markEmpId');
                const filterSelect = document.getElementById('filterEmployee');
                select.innerHTML = '<option value="">Select Employee</option>';
                filterSelect.innerHTML = '<option value="">All Employees</option>';
                employees.forEach(emp => {
                    const option = `<option value="${emp.Emp_id}">${emp.Emp_firstName} ${emp.Emp_lastName} (${emp.Emp_code})</option>`;
                    select.innerHTML += option;
                    filterSelect.innerHTML += option;
                });
            } catch (e) {
                alert('Failed to load employees');
            }
        }

        async function loadCategories() {
            try {
                const res = await API.getProjectCategories();
                categories = res.data || [];
                const select = document.getElementById('filterCategory');
                select.innerHTML = '<option value="">All Categories</option>';
                categories.forEach(cat => {
                    select.innerHTML += `<option value="${cat.ProjectCategory_id}">${cat.Category_name}</option>`;
                });
            } catch (e) {
                console.error('Failed to load categories');
            }
        }

        async function loadAttendance() {
            const empId = document.getElementById('filterEmployee').value;
            const categoryId = document.getElementById('filterCategory').value;
            const date = document.getElementById('filterDate').value;
            
            try {
                let url = `../backend/index.php?action=attendance`;
                if (empId) url += `&empId=${empId}`;
                if (categoryId) url += `&categoryId=${categoryId}`;
                if (date) url += `&date=${date}`;
                
                const res = await fetch(url);
                const data = await res.json();
                
                const tbody = document.getElementById('attendanceTableBody');
                if (data.success && data.data.length > 0) {
                    tbody.innerHTML = data.data.map(att => `
                        <tr>
                            <td>${att.Date}</td>
                            <td>${att.Emp_firstName} ${att.Emp_lastName}</td>
                            <td>${att.Category_name || '-'}</td>
                            <td><span class="badge bg-${att.Status === 'Present' ? 'success' : att.Status === 'Absent' ? 'danger' : 'warning'}">${att.Status}</span></td>
                            <td>${att.Checkin_time || '-'}</td>
                            <td>${att.Checkout_time || '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="editAttendance(${att.Attendance_id}, '${att.Date}', ${att.Emp_id}, '${att.Status}', '${att.Checkin_time || ''}', '${att.Checkout_time || ''}')">Edit</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">No attendance records found</td></tr>';
                }
            } catch (e) {
                document.getElementById('attendanceTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error loading attendance</td></tr>';
            }
        }

        document.getElementById('markAttendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                empId: parseInt(document.getElementById('markEmpId').value),
                date: document.getElementById('markDate').value,
                status: document.getElementById('markStatus').value,
                checkinTime: document.getElementById('markCheckin').value || null,
                checkoutTime: document.getElementById('markCheckout').value || null
            };
            try {
                await API.markAttendance(data);
                alert('Attendance marked successfully');
                bootstrap.Modal.getInstance(document.getElementById('markAttendanceModal')).hide();
                loadAttendance();
            } catch (e) {
                alert('Failed to mark attendance: ' + e.message);
            }
        });

        function editAttendance(id, date, empId, status, checkin, checkout) {
            document.getElementById('markEmpId').value = empId;
            document.getElementById('markDate').value = date;
            document.getElementById('markStatus').value = status;
            document.getElementById('markCheckin').value = checkin;
            document.getElementById('markCheckout').value = checkout;
            new bootstrap.Modal(document.getElementById('markAttendanceModal')).show();
        }

        document.getElementById('markDate').valueAsDate = new Date();
        document.addEventListener('DOMContentLoaded', () => {
            loadEmployees();
            loadCategories();
            loadAttendance();
        });
    </script>
</body>
</html>
